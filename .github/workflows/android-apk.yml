name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [dsh-app]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: preview
      EXPO_APP_NAME: HarnessLink
      EXPO_ANDROID_PACKAGE: com.moqingfenglan.harnesslink
      EXPO_PUBLIC_HAPPY_SERVER_URL: https://api.happier.dev
      EXPO_UNSTABLE_WEB_MODAL: '1'
      HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native
      HAPPIER_ANDROID_GRADLE_JVMARGS: -Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
      YARN_PRODUCTION: 'false'
      npm_config_production: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Enable Yarn 1
        run: |
          corepack disable || true
          npm install -g yarn@1.22.22 --silent

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build workspace packages
        run: yarn build:packages

      - name: Expo prebuild (Android)
        run: yarn workspace @happier-dev/app prebuild

      - name: Gradle assembleDebug
        working-directory: apps/ui/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harnesslink-debug-apk
          path: apps/ui/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
