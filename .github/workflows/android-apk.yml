name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [dsh-app]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: preview
      EXPO_APP_NAME: HarnessLink
      EXPO_ANDROID_PACKAGE: dev.happier.app
      EXPO_PUBLIC_HAPPY_SERVER_URL: https://api.happier.dev
      EXPO_UNSTABLE_WEB_MODAL: '1'
      HAPPIER_INSTALL_SCOPE: ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native
      HAPPIER_ANDROID_GRADLE_JVMARGS: -Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
      YARN_PRODUCTION: 'false'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'
      npm_config_production: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android
          sudo apt-get clean
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Enable Yarn 1
        run: |
          corepack disable || true
          npm install -g yarn@1.22.22 --silent

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build workspace packages
        run: yarn build:packages

      - name: Expo prebuild (Android)
        run: yarn workspace @happier-dev/app prebuild

      - name: Gradle assembleRelease
        working-directory: apps/ui/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harnesslink-release-apk
          path: apps/ui/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
